  - {name: south_wall, center: [0.0, -5.0], size: [10.2, 0.2], height: 1.0}
  - {name: east_wall, center: [5.0, 0.0], size: [0.2, 10.0], height: 1.0}
  - {name: west_wall, center: [-5.0, 0.0], size: [0.2, 10.0], height: 1.0}
  - {name: divider_north, center: [1.0, 3.3], size: [0.2, 3.2], height: 1.0}
  - {name: divider_south, center: [1.0, -3.3], size: [0.2, 3.2], height: 1.0}
  - {name: cabinet_west, center: [-2.6, 1.4], size: [1.2, 0.7], height: 0.8}
  - {name: cabinet_south, center: [-2.4, -2.4], size: [0.8, 1.2], height: 0.8}
