# Single source of geometry for worlds/demo.sdf and maps/demo.{pgm,yaml}.
world_name: demo
resolution: 0.05
origin: [-6.0, -6.0]
size: [12.0, 12.0]
# Axis-aligned boxes: center [x, y], planar size [x, y], height [m].
# Spawn at (0, 0, 0.02); every route has clearance for a 0.36 m robot.
