gesture_recognition_node:
  ros__parameters:
    use_sim_time: false
    camera_index: 0
    width: 640
    height: 480
    frame_rate: 15.0
    confidence: 0.65
    stop_confidence: 0.50
    stable_time: 0.15
    wave_amplitude: 0.04  # fraction of image width; fingertips, not only palm center
    wave_window: 2.5
    mirror: true
    show_window: true

robot_behavior_node:
  ros__parameters:
    use_sim_time: true
    stable_frames: 2  # observations per event; pending choices never expire
    signal_timeout: 0.75
    hand_timeout: 0.40
    sensor_timeout: 0.8
    publish_rate: 20.0
    linear_speed: 0.12
    angular_speed: 0.5
    leg_distance: 0.35
    circle_radius: 0.60
    greeting_angle: 0.45
    progress_timeout: 5.0
    max_duration: 120.0
    stop_distance: 0.40
    rotation_clearance: 0.30
